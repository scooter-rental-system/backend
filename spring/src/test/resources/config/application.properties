# Test-only safety net. Spring Boot loads classpath:/config/application.properties in addition to, and with
# higher precedence than, the main application.properties, so no test can fall back to a real database.
# Integration tests replace this placeholder with the embedded PostgreSQL (see PostgresIntegrationTest);
# TestDatabaseGuard rejects every other database URL before any connection is opened.
spring.profiles.active=test
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/embedded_test_db_not_started
spring.datasource.username=embedded_test_only
spring.datasource.password=embedded_test_only

# Repair photos written by tests stay inside the build directory.
app.repairs.photo-dir=build/test-repair-photos

# Payment images (QR image, transfer receipts) written by tests stay inside the build directory.
app.payments.image-dir=build/test-payment-images

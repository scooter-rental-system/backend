# Test profile. The datasource is supplied at runtime by PostgresIntegrationTest (embedded PostgreSQL 16);
# config/application.properties holds the fail-closed placeholder. All secrets below are fake, test-only values.
spring:
  jpa:
    show-sql: false
  flyway:
    baseline-on-migrate: false
    clean-disabled: true

app:
  seed:
    enabled: false
  # No scheduled job runs in the background of automated tests.
  scheduling:
    enabled: false
    reminders:
      enabled: false
  gps:
    simulator-enabled: false
  jwt:
    secret: test-only-jwt-secret-not-for-production-0123456789
  payments:
    webhook-secret: test-only-webhook-secret

# Test profile. The datasource is supplied at runtime by PostgresIntegrationTest (embedded PostgreSQL 16);
# config/application.properties holds the fail-closed placeholder. All secrets below are fake, test-only values.
spring:
  jpa:
    show-sql: false
  flyway:
    baseline-on-migrate: false
    clean-disabled: true

app:
  seed:
    enabled: false
  # No scheduled job runs in the background of automated tests.
  scheduling:
    enabled: false
    reminders:
      enabled: false
  gps:
    # Test-only device key (not a real credential); production reads GPS_DEVICE_API_KEY from the environment.
    device-api-key: test-device-key-not-a-secret
    retention-months: 6
  jwt:
    secret: test-only-jwt-secret-not-for-production-0123456789
  payments:
    # Not "mock": the application's mock provider stays off; tests use the test-only TestPaymentGateway.
    provider: test-gateway
    webhook-secret: test-only-webhook-secret

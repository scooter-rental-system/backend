# Production profile: activate with SPRING_PROFILES_ACTIVE=prod. It only overrides application.properties.
# Every value that differs per environment comes from the environment; no secret or credential is stored here.
# A missing required variable (no default below) stops startup instead of falling back to a local value.

# Database (required): e.g. the RDS endpoint and its credentials, supplied by the deployment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# No SQL statements in the logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Never seed demo users (known passwords) or demo fleet data in production.
app.seed.enabled=false

# Required: the JWT signing secret (>= 32 random bytes; JwtSecretPolicy names it if missing or weak) and the frontend
# origin(s), e.g. https://app.example.lk.
app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ORIGINS}

# Behind the load balancer: take the client address from X-Forwarded-For, trusting only internal proxies (Tomcat's
# RemoteIpValve). Login rate limiting and contract signing records then see the customer's address, not the proxy's.
server.forward-headers-strategy=native

# Error responses never include stack traces or exception messages.
server.error.include-stacktrace=never
server.error.include-message=never

spring.application.name=spring

#  DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/scooter_rent_db
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App port
server.port=8080

app.billing.currency=LKR

# Payments (SDS 4.2): Stripe only. No defaults: with PAYMENTS_PROVIDER unset, card payments are unavailable (503);
# with PAYMENTS_PROVIDER=stripe, startup fails unless all three Stripe keys are set in the environment.
app.payments.provider=${PAYMENTS_PROVIDER:}
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

spring.flyway.locations=classpath:migration,classpath:db/migration

app.seed.enabled=true

# GPS devices authenticate with this key (X-Device-Key). No default: unset means device reports are refused.
app.gps.device-api-key=${GPS_DEVICE_API_KEY:}
# SDS 8.3: GPS logs are kept for 6 months (purged daily at 03:15 Colombo time).
app.gps.retention-months=6

# Scheduled jobs: unpaid-booking expiry and GPS retention. Customer reminders (BookingReminderJob) stay off unless
# deliberately enabled; each booking gets at most one reminder.
app.scheduling.enabled=true
app.scheduling.reminders.enabled=false

# Notifications (SDS 4.1, 7.1). In-app notifications need no configuration. Email: empty NOTIFICATIONS_EMAIL_PROVIDER
# means email is off (nothing is sent or recorded as sent); "ses" sends through Amazon SES and needs the verified sender
# address and the region, or startup fails; any other value stops startup. AWS credentials are not configured here:
# the AWS SDK reads them from its default credential chain (environment, profile or role). There is no SMS provider yet.
app.notifications.email.provider=${NOTIFICATIONS_EMAIL_PROVIDER:}
app.notifications.email.from=${NOTIFICATIONS_EMAIL_FROM:}
app.notifications.email.region=${AWS_REGION:}

# JWT signing secret: no built-in value. Unset locally means a random key for that run (sign-ins end on restart);
# under the prod profile a missing, short (< 32 bytes) or example secret stops startup (JwtSecretPolicy).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=720
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Public frontend address, used for links in emails (password reset). No default: unset means reset emails are
# not sent. Local: http://localhost:5173; production: the deployed https address.
app.frontend-url=${APP_FRONTEND_URL:}

# Support contact shown to customers next to the repair/breakdown report (optional; not shown when unset).
app.support.phone=${SUPPORT_PHONE:}
app.support.email=${SUPPORT_EMAIL:}